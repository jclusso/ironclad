name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Verify tag matches Ironclad::VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          gem_version="$(ruby -r ./lib/ironclad/version -e 'print Ironclad::VERSION')"
          if [ "$tag" != "$gem_version" ]; then
            echo "::error::Tag v$tag does not match Ironclad::VERSION $gem_version."
            exit 1
          fi

      - name: Publish to RubyGems
        uses: rubygems/release-gem@v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gem build ironclad.gemspec --output ironclad.gem
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ironclad.gem
